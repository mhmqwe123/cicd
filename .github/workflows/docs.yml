name: Documentation CI

on:
  push:
    branches: ["release"]
    paths:
      - "**.py"
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:  # возможность запустить вручную из вкладки Actions

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install pydoc-markdown

      - name: Generate Markdown docs from docstrings
        run: |
          mkdir -p docs/build
          pydoc-markdown -m app > docs/build/app.md
          echo "Документация сгенерирована из docstring'ов app.py"

      - name: Convert Markdown to HTML
        run: |
          pip install markdown
          python - <<'EOF'
          import markdown
          from pathlib import Path

          md_text = Path("docs/build/app.md").read_text(encoding="utf-8")
          html = markdown.markdown(md_text, extensions=["fenced_code", "tables"])

          readme = Path("README.md").read_text(encoding="utf-8")
          readme_html = markdown.markdown(readme, extensions=["fenced_code", "tables"])

          page = f"""<!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <title>Документация проекта</title>
            <style>
              body {{ font-family: -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }}
              h1, h2, h3 {{ color: #24292f; }}
              code {{ background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }}
              pre {{ background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; }}
              hr {{ border: none; border-top: 1px solid #d0d7de; margin: 2rem 0; }}
            </style>
          </head>
          <body>
            <h1>📘 Документация проекта</h1>
            {readme_html}
            <hr>
            <h1>🐍 API Reference (из docstring'ов)</h1>
            {html}
            <hr>
            <p><em>Сгенерировано автоматически в GitHub Actions.</em></p>
          </body>
          </html>
          """

          Path("docs/build/index.html").write_text(page, encoding="utf-8")
          print("HTML-документация собрана: docs/build/index.html")
          EOF

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-documentation
          path: docs/build/
          retention-days: 30
